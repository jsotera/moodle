<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" rel="stylesheet">
    <link href="assets/css/course.css?v={{assetVersion}}" rel="stylesheet">
  </head>
  <body data-page-id="{{pageId}}">
    <div class="app-shell">
      <aside class="site-sidebar" data-sidebar>
        <div class="sidebar-brand p-3">
          <a class="d-flex align-items-center text-decoration-none" href="index.html" aria-label="Ir al inicio">
            <div>
              <strong class="brand-title d-block">{{moduleTitle}}</strong>
              <span class="small text-muted">DAM y DAW</span>
            </div>
          </a>
        </div>
        <nav class="course-tree" data-course-tree aria-label="Unidades de trabajo"></nav>
      </aside>

      <div class="sidebar-backdrop" data-sidebar-backdrop></div>

      <div class="site-main">
        <header class="topbar">
          <div class="container-fluid py-2 px-3">
            <div class="d-flex flex-wrap align-items-center gap-3">
              <button class="btn btn-outline-primary menu-toggle" type="button" data-menu-toggle aria-label="Plegar o desplegar menú" aria-expanded="true">
                <i class="fas fa-bars" aria-hidden="true"></i>
              </button>

              <a class="d-flex align-items-center gap-2 text-decoration-none me-auto" href="index.html">
                <img class="brand-logo" src="assets/img/logo-maria-ana-sanz.png" alt="Logo María Ana Sanz">
                <div>
                  <strong class="brand-title d-block">{{moduleSubtitle}}</strong>
                  <span class="small text-muted">CI María Ana Sanz</span>
                </div>
              </a>

              <div class="search-panel col-12 col-md-5 col-xl-4">
                <label class="visually-hidden" for="siteSearch">Buscar en el temario</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="fas fa-search" aria-hidden="true"></i></span>
                  <input id="siteSearch" class="form-control" type="search" placeholder="Buscar en el temario..." autocomplete="off" data-search-input>
                </div>
                <div class="search-results" data-search-results hidden></div>
              </div>
            </div>
          </div>
        </header>

        <main class="page-wrap">
          <nav class="breadcrumb-nav" aria-label="Migas de pan"><ol class="breadcrumb" data-breadcrumb></ol></nav>
{{content}}
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/search-data.js?v={{assetVersion}}"></script>
    <script src="assets/js/course.js?v={{assetVersion}}"></script>
  </body>
</html>
