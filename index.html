<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Materiales Moodle</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3f6f9;
        color: #202833;
      }
      main {
        width: min(960px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3rem 0;
      }
      h1 {
        color: #083c5f;
        margin-bottom: 0.5rem;
      }
      .module-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
        margin-top: 2rem;
      }
      .module-card {
        display: grid;
        gap: 0.4rem;
        padding: 1rem;
        border: 1px solid #d9e2ea;
        border-radius: 0.75rem;
        background: #ffffff;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 0.75rem 1.75rem rgba(15, 35, 52, 0.08);
      }
      .module-card:hover {
        border-color: #0f5d8f;
      }
      .module-code {
        width: fit-content;
        padding: 0.2rem 0.5rem;
        border-radius: 999px;
        background: #ffe8a3;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Materiales Moodle</h1>
      <p>Acceso a los módulos publicados.</p>
      <div class="module-grid">
      <a class="module-card" href="./prom/">
        <span class="module-code">PROM</span>
        <strong>Programación</strong>
        <span>Materiales de Programación para DAM y DAW.</span>
      </a>
      <a class="module-card" href="./lmgi/">
        <span class="module-code">LMGI</span>
        <strong>Lenguaje de Marcas y Gestión de la Información</strong>
        <span>Materiales de Lenguaje de Marcas y Gestión de la Información para DAM y DAW.</span>
      </a>
      </div>
    </main>
  </body>
</html>
